<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - VeriFace Proof</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-top: #F3F0FA;
            --bg-gradient-bottom: #E2DBF2;
            --primary-navy: #1E1B3A;
            --accent-violet: #6B5FA8;
            --accent-violet-hover: #594d94;
            --text-primary: #1E1B3A;
            --text-secondary: #64748B;
            --text-light: #FFFFFF;
            --card-light-bg: rgba(255, 255, 255, 0.9);
            --border-soft: rgba(107, 95, 168, 0.15);
        }

        body {
            background: linear-gradient(180deg, rgba(243, 240, 250, 0.5) 0%, rgba(226, 219, 242, 0.7) 100%), url('/static/images/hero_bg.jpg') center/cover no-repeat;
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .micro-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent-violet);
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        /* Buttons */
        .btn-pill {
            background: var(--accent-violet);
            color: var(--text-light) !important;
            font-weight: 600;
            border-radius: 50px;
            padding: 9px 24px;
            border: none;
            text-decoration: none !important;
            box-shadow: 0 10px 25px rgba(107, 95, 168, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
        }

        .btn-pill:hover {
            background: var(--accent-violet-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(107, 95, 168, 0.35);
        }

        .btn-pill-outline {
            background: transparent;
            color: var(--accent-violet) !important;
            font-weight: 600;
            border-radius: 50px;
            padding: 8px 20px;
            border: 2px solid var(--accent-violet);
            text-decoration: none !important;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-pill-outline:hover {
            background: rgba(107, 95, 168, 0.08);
            transform: translateY(-2px);
        }

        /* Navbar */
        .navbar {
            padding: 10px 0;
            background: transparent;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--primary-navy);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none !important;
        }

        .brand-logo i {
            color: var(--accent-violet);
            font-size: 1.5rem;
        }

        /* Login Card */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-soft);
            border-radius: 28px;
            padding: 44px 40px;
            box-shadow: 0 20px 50px rgba(30, 27, 58, 0.1);
            max-width: 460px;
            width: 100%;
        }

        .form-control-custom {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border-soft);
            background: rgba(243, 240, 250, 0.4);
            font-size: 0.95rem;
            color: var(--primary-navy);
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            background: #ffffff;
            border-color: var(--accent-violet);
            box-shadow: 0 0 0 4px rgba(107, 95, 168, 0.15);
        }

        .nav-pills-custom .nav-link {
            border-radius: 50px;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 8px 24px;
        }

        .nav-pills-custom .nav-link.active {
            background-color: var(--accent-violet);
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="brand-logo" href="/">
                <i class="fa-solid fa-shield-cat"></i>
                <span>VeriFace Proof</span>
            </a>
            <a href="/" class="btn-pill-outline btn-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <!-- Login Workspace -->
    <div class="login-container">
        <div class="login-card">
            
            <div class="text-center mb-4">
                <span class="micro-label">Secure Authentication</span>
                <h2 class="h3 fw-bold mb-2">Welcome Back</h2>
                <p class="text-secondary small">Access your face identification & blockchain proof ledger dashboard</p>
            </div>

            <!-- Login / Register Tabs -->
            <ul class="nav nav-pills nav-pills-custom justify-content-center mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-panel" type="button">Log In</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-panel" type="button">Sign Up</button>
                </li>
            </ul>

            <div class="tab-content" id="authTabContent">
                
                <!-- Log In Form -->
                <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Email or Username</label>
                            <input type="text" name="email" class="form-control form-control-custom" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label text-muted small fw-semibold">Password</label>
                                <a href="#" class="small text-decoration-none" style="color: var(--accent-violet);">Forgot?</a>
                            </div>
                            <input type="password" name="password" class="form-control form-control-custom" placeholder="••••••••" required>
                        </div>
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-secondary small" for="rememberMe">Remember this device</label>
                        </div>

                        <button type="submit" class="btn-pill w-100 mb-3">
                            <i class="fa-solid fa-right-to-bracket"></i> Log In to Dashboard
                        </button>
                    </form>

                    <div class="text-center position-relative my-4">
                        <hr style="border-color: var(--border-soft);">
                        <span class="position-absolute top-50 start-50 translate-middle px-3 text-muted small bg-white rounded-pill">OR</span>
                    </div>

                    <button class="btn-pill-outline w-100" onclick="alert('Web3 Metamask Wallet Auth Connected!')">
                        <i class="fa-brands fa-ethereum text-warning"></i> Continue with Web3 Wallet
                    </button>
                </div>

                <!-- Sign Up Form -->
                <div class="tab-pane fade" id="register-panel" role="tabpanel">
                    <form action="/login" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Full Name</label>
                            <input type="text" name="name" class="form-control form-control-custom" placeholder="Alex Dev" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control form-control-custom" placeholder="alex@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-semibold">Create Password</label>
                            <input type="password" name="password" class="form-control form-control-custom" placeholder="At least 8 characters" required>
                        </div>

                        <button type="submit" class="btn-pill w-100">
                            <i class="fa-solid fa-user-plus"></i> Create Account
                        </button>
                    </form>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
